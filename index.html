<!DOCTYPE html><html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Pacientes</title>
    <link rel="stylesheet" href="./src/style.css">
</head><body><h1>Control de Pacientes</h1>

<p class="subtitulo">
    Administración de pacientes y medicamentos
</p>

<form class="form">

    <input
        type="text"
        name="nombre"
        placeholder="Nombre del paciente"
        required
    >

    <input
        type="number"
        name="edad"
        placeholder="Edad"
        required
    >

    <fieldset>

        <legend>Sexo</legend>

        <label>
            <input
                type="radio"
                name="sexo"
                value="Femenino"
                checked
            >
            Femenino
        </label>

        <label>
            <input
                type="radio"
                name="sexo"
                value="Masculino"
            >
            Masculino
        </label>

    </fieldset>

    <select name="medicamento">

        <option value="Paracetamol">Paracetamol</option>

        <option value="Ibuprofeno">Ibuprofeno</option>

        <option value="Amoxicilina">Amoxicilina</option>

        <option value="Omeprazol">Omeprazol</option>

    </select>

    <fieldset>

        <legend>Horario del medicamento</legend>

        <label>
            <input
                type="checkbox"
                name="horario"
                value="Mañana"
            >
            Mañana
        </label>

        <label>
            <input
                type="checkbox"
                name="horario"
                value="Tarde"
            >
            Tarde
        </label>

        <label>
            <input
                type="checkbox"
                name="horario"
                value="Noche"
            >
            Noche
        </label>

    </fieldset>

    <input
        type="text"
        name="enfermera"
        placeholder="Nombre de la enfermera"
        required
    >

    <select name="turno">

        <option value="Mañana">Turno de mañana</option>

        <option value="Tarde">Turno de tarde</option>

        <option value="Noche">Turno de noche</option>

    </select>

    <textarea
        name="observacion"
        placeholder="Observaciones"
    ></textarea>

    <button type="submit">
        Guardar paciente
    </button>

    <button
        type="button"
        class="cancelar"
        style="display: none;"
    >
        Cancelar actualización
    </button>

</form>

    <table class="table">
      <thead>

    <tr>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Sexo</th>
        <th>Medicamento</th>
        <th>Horario</th>
        <th>Enfermera</th>
        <th>Turno</th>
        <th>Observación</th>
        <th>Acción</th>
    </tr>

</thead>

<tbody>
</tbody>

</table>
    

<script type="module" src="./src/main.js"></script>

</body>
</html>
